name: Update menu

on:
  schedule:
    # Weekday mornings, ~5:00 AM ET (10:00 UTC)
    - cron: "0 10 * * 1-5"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-menu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install pillow

      - name: Build icons
        run: python3 scripts/make_icons.py

      - name: Fetch menu
        run: python3 scripts/fetch_menu.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data/ apple-touch-icon.png icon-512.png
          git diff --cached --quiet || git commit -m "Update menu data"
          git push
