<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>West Shore SD Menus</title>
<meta name="description" content="West Shore School District cafeteria menu, by day or by week. Pick your school.">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="West Shore SD Menus">
<link rel="apple-touch-icon" href="west-shore-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <main>
    <header class="header">
      <div class="header-titles">
        <h1>West Shore SD Menus</h1>
        <button type="button" id="school-btn" class="school-btn" aria-haspopup="dialog" aria-label="Choose a school">Highland Primary School <span class="chev">&#8964;</span></button>
      </div>
      <div class="header-actions">
        <button type="button" id="search-btn" class="header-pill search-btn" aria-label="Search foods" aria-expanded="false" aria-controls="searchnav">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        </button>
      </div>
    </header>

    <div class="segmented" role="tablist" aria-label="Menu view">
      <button id="tab-day" class="seg active" role="tab" aria-selected="true">Day</button>
      <button id="tab-week" class="seg" role="tab" aria-selected="false">Week</button>
    </div>

    <nav class="daynav" id="daynav" aria-label="Choose a day">
      <button id="prev-day" class="arrow" aria-label="Previous day">&#8249;</button>
      <button id="today-btn" class="today-btn">Today</button>
      <div class="date-label" id="date-label">&nbsp;</div>
      <button id="next-day" class="arrow" aria-label="Next day">&#8250;</button>
    </nav>

    <nav class="daynav" id="weeknav" aria-label="Choose a week" hidden>
      <button id="prev-week" class="arrow" aria-label="Previous week">&#8249;</button>
      <div class="date-label" id="week-label">&nbsp;</div>
      <button id="next-week" class="arrow" aria-label="Next week">&#8250;</button>
    </nav>

    <div class="searchbox" id="searchnav" hidden>
      <input type="search" id="search-input" placeholder="Search a food&hellip;" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search menu items">
      <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>
      <div id="search-suggest" class="suggest" hidden></div>
    </div>

    <div id="content" aria-live="polite">
      <div class="card"><p class="muted">Loading menu&hellip;</p></div>
    </div>

    <h2 id="settings-title" class="settings-title">Settings</h2>
    <section class="settings" aria-labelledby="settings-title">
      <label class="setting-row">
        <span class="setting-label">Show lunch first</span>
        <input type="checkbox" id="set-lunch-first" class="switch" role="switch">
      </label>
      <label class="setting-row">
        <span class="setting-label">After 6 PM, open tomorrow&rsquo;s menu</span>
        <input type="checkbox" id="set-after6-tomorrow" class="switch" role="switch">
      </label>
    </section>

    <a class="balance-link" href="https://linqconnect.com" target="_blank" rel="noopener">Check meal balance <span aria-hidden="true">&#8599;</span></a>

    <footer class="footer" id="footer"></footer>
  </main>

  <div id="school-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Choose a school">
    <div id="school-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-head">
        <span class="sheet-title">Choose a school</span>
        <button type="button" id="school-close" class="sheet-close" aria-label="Close">&times;</button>
      </div>
      <ul id="school-list" class="school-list"></ul>
    </div>
  </div>
  <!-- Bump the ?v=N on app.js / styles.css with every deploy so cached home-screen installs pick up the new files. -->
  <script src="app.js?v=13"></script>
</body>
</html>
