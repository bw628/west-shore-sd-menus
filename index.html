<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Lunch Menu — Highland Elementary</title>
<meta name="description" content="Highland Elementary cafeteria menu: breakfast entrees and lunch entrees + Express, by day or by week.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lunch Menu">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="header">
      <h1>School Lunch Menu</h1>
      <p class="subtitle">Highland Elementary</p>
    </header>

    <div class="segmented" role="tablist" aria-label="Menu view">
      <button id="tab-day" class="seg active" role="tab" aria-selected="true">Day</button>
      <button id="tab-week" class="seg" role="tab" aria-selected="false">Week</button>
    </div>

    <nav class="daynav" id="daynav" aria-label="Choose a day">
      <button id="prev-day" class="arrow" aria-label="Previous day">&#8249;</button>
      <button id="today-btn" class="today-btn">Today</button>
      <div class="date-label" id="date-label">&nbsp;</div>
      <button id="next-day" class="arrow" aria-label="Next day">&#8250;</button>
    </nav>

    <nav class="daynav" id="weeknav" aria-label="Choose a week" hidden>
      <button id="prev-week" class="arrow" aria-label="Previous week">&#8249;</button>
      <div class="date-label" id="week-label">&nbsp;</div>
      <button id="next-week" class="arrow" aria-label="Next week">&#8250;</button>
    </nav>

    <div id="content" aria-live="polite">
      <div class="card"><p class="muted">Loading menu&hellip;</p></div>
    </div>

    <footer class="footer" id="footer"></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
